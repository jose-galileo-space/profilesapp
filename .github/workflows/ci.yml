name: orbital_analytics CI

on:
  push:
    paths:
      - "orbital_analytics/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "orbital_analytics/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: orbital_analytics

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orbital_analytics/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit tests (jest)
        run: npx jest --ci

      - name: CDK synth (alpha)
        run: npx cdk synth --context stage=alpha >/dev/null

  python-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check our Lambda handlers (explicit list, no vendored deps)
        run: |
          set -e
          for f in lambdas/ingest/index.js lambdas/triggers/index.js lambdas/tasking/index.js; do
            node --check "$f"
          done
          python -m py_compile \
            lambdas/alerting/main.py \
            lambdas/alerting/ais_adapter.py \
            lambdas/analytics/gemini/main.py \
            lambdas/analytics/object_detection/main.py \
            lambdas/api/activity/main.py \
            lambdas/api/aoi/main.py \
            lambdas/api/get_images/main.py \
            lambdas/api/reports/main.py \
            lambdas/api/usage/main.py \
            lambdas/intelligence/main.py \
            lambdas/processing/correction/main.py \
            product_loop/demo/seed.py
